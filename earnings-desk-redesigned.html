let db;try{db=JSON.parse(localStorage.getItem('earningsDeskV1'))||make()}catch{db=make()}let role='Analyst A',page='desk',id='APX',tab='evidence',filter='all',sort='surprise',search='',inspect=-1,queue=true,minutes=485;const $=s=>document.querySelector(s);const company=()=>db.find(c=>c.id===id);const time=()=>`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')} ET`;const save=()=>{try{localStorage.setItem('earningsDeskV1',JSON.stringify(db))}catch{}};function log(c,msg){c.history.unshift({by:role,at:time(),msg});save()}function notify(msg){$('#toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2600)}function canEdit(c){return role===c.owner||role==='Team lead'}function status(c){return c.stale?'Re-review needed':c.pending?'Handoff pending':c.published.length?'View shared':c.owner==='Unassigned'?'Needs coverage':c.surprise===null?'Awaiting results':c.view?'Draft view':c.claims.some(x=>x.state==='Verified')?'Verifying evidence':'Not started'}function roleChange(v){role=v;if(role==='Research consumer')page='library';render()}function go(p){page=p;inspect=-1;render()}function openCompany(x){id=x;page='company';tab='evidence';inspect=-1;render()}function render(){save();$('#clock').textContent=time()+' · '+Math.max(0,570-minutes)+'m to open';$('#nav').innerHTML=`<small>WORKSPACE</small>${[['desk','▦  Earnings desk'],['mine','◉  My coverage'],['library','▤  Research library']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}<small>RECENT COMPANY</small><button onclick="openCompany('APX')">APX · Apex</button><small>DEMO CONTROLS</small><button onclick="simulate()">↻ New information</button><button onclick="resetDemo()">Reset demo</button><small>Fictional data · Local prototype</small>`;$('#main').innerHTML=page==='company'?workspace():page==='library'?library():desk()}
function desk(){let rows=db.filter(c=>(page!=='mine'||c.owner===role)&&(filter==='all'||filter==='attention'&&(c.priority===1||c.owner==='Unassigned'||c.stale)||filter==='shared'&&c.published.length)&&(`${c.name} ${c.id} ${c.owner}`.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>sort==='priority'?a.priority-b.priority||(Math.abs(b.surprise??-0)-Math.abs(a.surprise??-0)):(b.surprise===null?-1:Math.abs(b.surprise))-(a.surprise===null?-1:Math.abs(a.surprise)));return `<div class="eyebrow">TODAY / US EQUITIES</div><div class="row between"><div><h1>${page==='mine'?'My coverage':'Earnings overview'}</h1><div class="muted">Shared reporting day · ${time()} · Market open 09:30 ET</div></div><button onclick="simulate()">Simulate incoming update</button></div><div class="stats">${[[db.filter(c=>c.surprise!==null).length+'/12','Results received'],[db.filter(c=>c.priority===1).length,'Immediate priority'],[db.filter(c=>c.owner==='Unassigned').length,'Unassigned coverage'],[db.filter(c=>c.published.length).length,'Views shared']].map(([n,t])=>`<div class="stat"><small>${t}</small><b>${n}</b></div>`).join('')}</div><div class="notice"><b>Attention required</b> · ${db.filter(c=>c.owner==='Unassigned').length} companies need coverage · ${db.filter(c=>c.priority===1).length} immediate priorities · Apex management call at 08:30 ET.</div><div class="toolbar"><select onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All companies</option><option value="attention" ${filter==='attention'?'selected':''}>Needs attention</option><option value="shared" ${filter==='shared'?'selected':''}>Published</option></select><select onchange="sort=this.value;render()"><option value="surprise" ${sort==='surprise'?'selected':''}>Largest revenue surprise</option><option value="priority" ${sort==='priority'?'selected':''}>Investigation priority</option></select><input placeholder="Search companies" value="${esc(search)}" oninput="search=this.value;document.querySelector('#rows').innerHTML=deskRows()"></div><div class="scroll"><table><thead><tr><th>Company</th><th>Revenue surprise</th><th>Guidance revision</th><th>Priority</th><th>Coverage owner</th><th>Research status</th><th>Call (ET)</th><th></th></tr></thead><tbody id="rows">${rows.map(row).join('')}</tbody></table></div><p class="foot">Surprise ranks by absolute revenue deviation from consensus; guidance revision compares prior guidance. Priority is human-assigned. Incoming figures are provisional until checked.</p>`}function deskRows(){return db.filter(c=>(page!=='mine'||c.owner===role)&&(filter==='all'||filter==='attention'&&(c.priority===1||c.owner==='Unassigned'||c.stale)||filter==='shared'&&c.published.length)&&`${c.name} ${c.id} ${c.owner}`.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==='priority'?a.priority-b.priority:Math.abs(b.surprise??0)-Math.abs(a.surprise??0)).map(row).join('')}function row(c){return `<tr><td><a onclick="openCompany('${c.id}')">${esc(c.name)}</a><br><small>${c.id} · ${c.sector}</small></td><td>${delta(c.surprise)}${c.surprise===null?'':`<div style="width:66px;height:3px;background:#e9ecf4;border-radius:3px;margin-top:5px"><div style="width:${Math.min(100,Math.abs(c.surprise)/6*100)}%;height:3px;border-radius:3px;background:${c.surprise<0?'#b4233b':'#087a55'}"></div></div>`}</td><td>${delta(c.guidance)}</td><td><span class="tag ${c.priority===1?'warn':''}">P${c.priority}</span></td><td>${esc(c.owner)}</td><td>${esc(status(c))}</td><td>${c.call}</td><td><button onclick="coordinate('${c.id}')">${role==='Team lead'?'Manage':'Details'}</button></td></tr>`}
function modal(title,body,foot=''){ $('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-label="${esc(title)}"><div class="row between"><h2>${esc(title)}</h2><button onclick="closeModal()">✕</button></div>${body}<footer>${foot}</footer></section></div>`}function closeModal(){$('#modal').innerHTML=''}function coordinate(x){let c=db.find(z=>z.id===x);modal(c.name,`<p>${esc(c.reason)}</p><p>Owner: ${esc(c.owner)} · ${esc(status(c))}</p><p>Next event: ${c.call} ET</p>${role==='Team lead'?`<label>Priority</label><select id="cp">${[1,2,3].map(n=>`<option ${n===c.priority?'selected':''}>${n}</option>`)}</select><label>Owner</label><select id="co">${['Analyst A','Analyst B','Analyst C','Analyst D','Unassigned'].map(n=>`<option ${n===c.owner?'selected':''}>${n}</option>`)}</select><label>Priority rationale</label><textarea id="cr">${esc(c.reason)}</textarea>`:''}`,role==='Team lead'?`<button class="primary" onclick="applyCoord('${x}')">Save assignment</button>`:`<button onclick="closeModal();openCompany('${x}')">Open workspace</button>`)}function applyCoord(x){let c=db.find(z=>z.id===x);c.priority=+$('#cp').value;c.owner=$('#co').value;c.reason=$('#cr').value;c.pending=null;log(c,'Lead updated priority and coverage');closeModal();render();notify('Coordination updated')}
function workspace(){let c=company();return `<div class="row between"><div><button onclick="go('desk')">← Earnings desk</button></div><div class="row"><button onclick="queue=!queue;render()">${queue?'Hide':'Show'} queue</button><button onclick="handoff()">Coverage handoff</button></div></div><div class="workspace ${inspect>=0?'inspect':''} ${queue?'':'noqueue'}">${queue?`<aside class="queue"><div class="eyebrow">COVERAGE QUEUE</div>${db.map(z=>`<button class="${z.id===id?'active':''}" onclick="openCompany('${z.id}')"><b>${z.id}</b> ${delta(z.surprise)}<br><small>${esc(z.name)}</small></button>`).join('')}</aside>`:''}<section class="content"><div class="eyebrow">${c.id} / Q3 FY26</div><h1>${esc(c.name)}</h1><div class="row"><span class="tag warn">P${c.priority}</span><span>${esc(c.owner)}</span><span class="muted">Call ${c.call} ET</span><span class="tag">${esc(status(c))}</span></div>${c.stale?'<div class="callout">New evidence may affect the published conclusion. Re-review required; prior version retained.</div>':''}<div class="tabs">${[['evidence','Evidence'],['view','Research view'],['activity','Activity'],['record','Published record']].map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';inspect=-1;render()">${t}</button>`).join('')}</div>${tab==='evidence'?evidence(c):tab==='view'?view(c):tab==='activity'?activity(c):record(c)}</section>${inspect>=0?source(c):''}</div>`}
function evidence(c){return `<div class="panel"><div class="metrics"><div class="metric"><small>Revenue surprise</small><b>${delta(c.surprise)}</b></div><div class="metric"><small>Guidance revision</small><b>${delta(c.guidance)}</b></div><div class="metric"><small>Evidence checked</small><b>${c.claims.filter(x=>x.state==='Verified').length}/${c.claims.length}</b></div></div></div><div class="panel"><h2>Previous thesis</h2>${esc(c.thesis)}</div><div class="panel"><div class="row between"><h2>AI-extracted financial evidence</h2><span class="tag">Human review required</span></div>${c.claims.length?`<div class="scroll"><table><thead><tr><th>Metric</th><th>Actual</th><th>Reference</th><th>Change</th><th>Review</th></tr></thead><tbody>${c.claims.map((x,i)=>`<tr class="${inspect===i?'selected':''}"><td><a onclick="inspect=${i};render()">${esc(x.name)}</a><br><small>${esc(x.source)}</small></td><td>${esc(x.actual)}</td><td>${esc(x.expected)}</td><td>${esc(x.diff)}</td><td><span class="tag ${x.state==='Verified'?'pos':x.error?'warn':''}">${esc(x.state)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Detailed source packet is available for Apex in this prototype.</div>'}<p class="foot">Select a claim to inspect its source and comparison basis. Verification count is not analytical readiness.</p><button class="primary" onclick="tab='view';inspect=-1;render()">Open research view →</button></div>`}
function source(c){let x=c.claims[inspect];if(!x)return '';return `<aside class="inspector"><div class="row between"><h2>Source inspector</h2><button onclick="inspect=-1;render()">✕</button></div><small>Fictional source packet · ${esc(x.source)}</small><div class="document"><b>APEX ELECTRONICS</b><br>Q3 FY26 results<hr><mark>${esc(x.quote)}</mark></div><h3>${esc(x.name)}</h3><p>Extracted: <b>${esc(x.actual)}</b><br>Reference: ${esc(x.expected)}</p>${x.error?'<div class="callout"><b>Accounting basis mismatch</b><br>GAAP margin was compared against an adjusted expectation.</div>':''}${x.state==='Verified'?`<div class="notice">Verified by ${esc(x.by)} · ${esc(x.at)}</div>`:canEdit(c)?`<button class="primary" onclick="${x.error?'correct()':'verify()'}">${x.error?'Correct comparison':'Verify claim'}</button>`:'<p class="muted">Only the owner or lead can verify.</p>'}<p class="foot">Source passages are synthetic, not real filings. Consensus references are fictional.</p></aside>`}function verify(){let c=company(),x=c.claims[inspect];if(!canEdit(c)||x.error)return;x.state='Verified';x.by=role;x.at=time();log(c,'Verified '+x.name);render();notify('Claim verified')}function correct(){let c=company();if(!canEdit(c))return;modal('Correct accounting basis',`<p>Choose the comparable reported value.</p><label><input type="radio" name="basis" value="gaap"> 14.2% · GAAP operating margin</label><label><input type="radio" name="basis" value="adj" checked> 16.8% · Adjusted operating margin</label><label>Correction rationale</label><textarea id="rationale">Use adjusted margin to match the adjusted consensus estimate.</textarea>`,`<button class="primary" onclick="applyCorrection()">Correct & verify</button>`)}function applyCorrection(){let c=company(),x=c.claims[inspect];if(!canEdit(c))return;if($('input[name=basis]:checked').value!=='adj'||!$('#rationale').value.trim()){notify('Choose comparable basis and provide rationale');return}let why=$('#rationale').value;x.actual='16.8%';x.diff='−30 bps';x.error=false;x.state='Verified';x.by=role;x.at=time();log(c,'Corrected 14.2% GAAP to 16.8% adjusted; '+why);closeModal();render();notify('Correction recorded')}
function view(c){let editable=canEdit(c);return `<div class="panel"><h2>Analytical research view</h2><p class="muted">Distinguish verified facts from interpretation. Material limitations remain visible in publication.</p><label>Previous thesis</label><p>${esc(c.thesis)}</p><label>Current interpretation</label><textarea id="v" ${editable?'':'disabled'}>${esc(c.view)}</textarea><label>Material uncertainty</label><textarea id="q" ${editable?'':'disabled'}>${esc(c.question)}</textarea><label>Next analytical action</label><textarea id="n" ${editable?'':'disabled'}>${esc(c.next)}</textarea>${editable?`<div class="row"><button onclick="draft()">✧ Suggest draft (simulated AI)</button><button onclick="saveView()">Save draft</button><button class="primary" onclick="saveView(false);review()">Review & share →</button></div>`:''}</div><div class="panel"><h2>Discussion · Material question</h2>${c.notes.map(n=>`<div class="thread"><b>${esc(n.by)}</b> <small>${esc(n.at)}</small><p>${esc(n.text)}</p></div>`).join('')||'<p class="muted">No discussion yet. Ask a colleague to challenge the interpretation.</p>'}${role!=='Research consumer'?`<textarea id="comment" placeholder="Add an evidence-linked question or interpretation…"></textarea><button onclick="comment()">Post discussion</button>`:''}</div>`}function draft(){let c=company();if(!canEdit(c))return;$('#v').value=c.id==='APX'?'Revenue miss and reduced FY26 guidance suggest downside risk to the growth thesis. The adjusted margin comparison is less severe than the initial AI extraction suggested.':'Further evidence is needed before establishing a thesis implication.';if(c.stale)$('#v').value+=' Management commentary suggests inventory correction contributed to the miss; structural demand weakness remains unconfirmed.';notify('Draft suggested; review before saving')}function saveView(show=true){let c=company();if(!canEdit(c))return;c.view=$('#v').value;c.question=$('#q').value;c.next=$('#n').value;log(c,'Updated draft research view');if(show){render();notify('Draft saved')}}function comment(){let c=company(),t=$('#comment').value.trim();if(!t||role==='Research consumer')return;c.notes.push({by:role,at:time(),text:t});log(c,'Added discussion on material question');render()}
function review(){let c=company();if(!canEdit(c))return;let ready=c.claims.length>0&&c.claims.every(x=>x.state==='Verified')&&c.view.trim()&&c.question.trim()&&c.next.trim();modal('Review & publish',`<p class="muted">Canonical research view · ${esc(c.name)} · ${esc(role)}</p>${ready?'':'<div class="callout">Publication blocked: verify all included financial claims and complete interpretation, limitation and next action.</div>'}<div class="split"><div class="panel"><h3>Team lead summary</h3><p>${esc(c.view)}</p><b>Material question</b><p>${esc(c.question)}</p><b>Next action</b><p>${esc(c.next)}</p><small>Owner: ${esc(c.owner)} · P${c.priority}</small></div><div class="panel"><h3>Wider firm summary</h3><p>${esc(c.view)}</p><b>Limitation</b><p>${esc(c.question)}</p><small>Source-linked financial evidence attached.</small></div></div><label>Recipients</label><label><input type="checkbox" id="lead" checked> Team lead</label><label><input type="checkbox" id="firm" checked> Wider firm</label><label><input type="checkbox" id="approve" onchange="$('#publish').disabled=!this.checked||!${!!ready}"> I have reviewed the evidence, interpretation and limitations and authorize publication.</label>`,`<button onclick="closeModal()">Return to draft</button><button id="publish" class="primary" disabled onclick="publish()">Approve & share</button>`)}function publish(){let c=company();if(!canEdit(c)||!$('#approve').checked||!c.claims.length||!c.claims.every(x=>x.state==='Verified')||!c.view.trim()||!c.question.trim()||!c.next.trim())return;let audiences=[$('#lead').checked?'Team lead':'',$('#firm').checked?'Wider firm':''].filter(Boolean);if(!audiences.length){notify('Select an audience');return}c.published.unshift({version:c.published.length+1,by:role,at:time(),view:c.view,question:c.question,next:c.next,audiences,claims:JSON.parse(JSON.stringify(c.claims))});c.stale=false;log(c,'Approved and shared research version '+c.published.length);closeModal();tab='record';render();notify('Research published locally')}
function record(c){return c.published.length?c.published.map(v=>`<div class="panel"><div class="row between"><h2>Qualified research view · V${v.version}</h2><span class="tag pos">Human approved</span></div><small>${esc(v.by)} · ${esc(v.at)} · ${esc(v.audiences.join(', '))}</small><p>${esc(v.view)}</p><h3>Material limitation</h3><p>${esc(v.question)}</p>${role!=='Research consumer'?`<h3>Next action</h3><p>${esc(v.next)}</p>`:''}<h3>Verified evidence</h3>${v.claims.map(x=>`<details><summary>${esc(x.name)} · ${esc(x.actual)} · ${esc(x.diff)}</summary><p>${esc(x.source)}: ${esc(x.quote)}</p><small>Verified by ${esc(x.by)} · ${esc(x.at)}</small></details>`).join('')}</div>`).join(''):'<div class="panel empty">No approved research yet.</div>'}function activity(c){return `<div class="panel"><h2>Audit history</h2>${c.history.map(x=>`<div class="thread"><b>${esc(x.by)}</b> · <small>${esc(x.at)}</small><p>${esc(x.msg)}</p></div>`).join('')||'<p>No activity recorded.</p>'}</div>`}function library(){let list=db.filter(c=>c.published.length);return `<div class="eyebrow">APPROVED RESEARCH</div><h1>Research library</h1><p class="muted">One canonical company record with preserved publication versions.</p>${list.map(c=>`<div class="panel"><div class="row between"><h2>${esc(c.name)}</h2><button onclick="id='${c.id}';page='company';tab='record';render()">Open record →</button></div>${c.stale?'<span class="tag warn">Re-review needed</span>':''}<p>${esc(c.published[0].view)}</p><small>V${c.published[0].version} · ${esc(c.published[0].by)} · ${esc(c.published[0].at)}</small></div>`).join('')||'<div class="panel empty">No published views. Complete Apex verification and approve a research view.</div>'}`}
function handoff(){let c=company();modal('Coverage handoff',`<p>${esc(c.name)} · Current owner: ${esc(c.owner)}</p><div class="panel"><h3>Context carried forward</h3><p>${c.claims.filter(x=>x.state==='Verified').length} verified claims</p><p>${esc(c.view||'No interpretation established')}</p><b>Unresolved</b><p>${esc(c.question)}</p><b>Next action</b><p>${esc(c.next)}</p></div>${c.pending?`<p>Pending acceptance by ${esc(c.pending.to)}</p><p>${esc(c.pending.note)}</p>`:canEdit(c)?`<label>Backup analyst</label><select id="backup">${['Analyst A','Analyst B','Analyst C','Analyst D'].filter(x=>x!==c.owner).map(x=>`<option>${x}</option>`).join('')}</select><label>Additional note</label><textarea id="hn"></textarea>`:''}`,c.pending?(role===c.pending.to?'<button class="primary" onclick="acceptHandoff()">Accept coverage</button>':canEdit(c)?'<button onclick="cancelHandoff()">Cancel transfer</button>':''):canEdit(c)?'<button class="primary" onclick="requestHandoff()">Request transfer</button>':'')}function requestHandoff(){let c=company();if(!canEdit(c))return;c.pending={to:$('#backup').value,note:$('#hn').value};log(c,'Requested handoff to '+c.pending.to);closeModal();render();notify('Switch to backup role to accept')}function acceptHandoff(){let c=company();if(c.pending?.to!==role)return;c.owner=role;c.pending=null;log(c,'Accepted coverage');closeModal();render()}function cancelHandoff(){let c=company();if(!canEdit(c))return;c.pending=null;log(c,'Cancelled handoff');closeModal();render()}
function simulate(){let c=db[0],l=db.find(x=>x.id==='LUM');if(l.surprise===null){l.surprise=-6.2;l.guidance=-3.1;minutes=490;log(l,'Simulated earnings results received');notify('Lumen results received; surprise ranking updated')}else if(!c.claims.some(x=>x.name==='Management commentary')){minutes=518;c.claims.push({name:'Management commentary',actual:'Inventory correction',expected:'Not applicable',diff:'—',source:'Earnings call · 08:38 ET',quote:'Channel inventory correction contributed to the revenue shortfall. Management did not quantify its impact or confirm structural demand weakness.',state:'Unchecked'});c.stale=!!c.published.length;log(c,'New commentary received; assess affected interpretation');notify('Apex: new evidence requires review')}else{notify('All scripted updates delivered')}render()}function resetDemo(){modal('Reset prototype','<p>Clear all local edits, approvals and history?</p>','<button onclick="closeModal()">Cancel</button><button class="primary" onclick="db=make();minutes=485;role=\'Analyst A\';$(\'#role\').value=role;page=\'desk\';filter=\'all\';search=\'\';sort=\'surprise\';closeModal();render()">Reset</button>')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
